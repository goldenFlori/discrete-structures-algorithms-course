# Ndërton dhe publikon faqen në GitHub Pages.
#
# Aktivizimi (një herë): Settings → Pages → Source: "GitHub Actions".
# Pas kësaj, çdo `git push` në `main` e rifreskon faqen për ~2 minuta.
name: Publiko faqen

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # lejon publikim manual nga skeda Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Lejo vetëm një publikim njëherësh; anulo atë në pritje nëse vjen një push i ri.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalo varësitë
        run: npm ci

      - uses: actions/configure-pages@v5
        id: pages

      - name: Ndërto faqen
        env:
          # Nxirren nga cilësimet e Pages, që faqja të punojë edhe në
          # `user.github.io/emri-i-repos/` edhe në një domen të vetin.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
